server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  portal-validacao.html index.html;

    # Compressão
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml image/x-icon text/markdown;

    # Arquivos estáticos
    location ~* \.(?:css|js|webp|png|jpe?g|svg|woff2|zip)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/seguranca.conf;
    }

    # Rotas gerais
    location / {
        try_files $uri $uri/ /portal-validacao.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguranca.conf;
    }
}
